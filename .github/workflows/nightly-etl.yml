name: Nightly ETL

# Builds the Istanbul GTFS and the app's static JSON, then publishes them as
# assets of the "data-latest" release. The server and the Pages build pull
# from there. If any step fails nothing is published and yesterday's data
# stays live (timetables are valid for 60 days).

on:
  schedule:
    - cron: "17 0 * * *"   # 03:17 Istanbul
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["etl/**", ".github/workflows/nightly-etl.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-etl
  cancel-in-progress: true

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      # Last good downloads, used when a portal is down (data.ibb.gov.tr sometimes times out).
      - uses: actions/cache@v4
        with:
          path: |
            etl/cache/iett
            etl/cache/old_gtfs
            etl/cache/osm
          key: etl-downloads-${{ github.run_id }}
          restore-keys: etl-downloads-
      - name: Download OSM and validator
        run: |
          mkdir -p cache/osm cache/tools
          curl -fsSL --retry 5 -o cache/osm/marmara.osm.pbf.part https://download.openstreetmap.fr/extracts/europe/turkey/marmara-latest.osm.pbf \
            && mv cache/osm/marmara.osm.pbf.part cache/osm/marmara.osm.pbf \
            || test -f cache/osm/marmara.osm.pbf
          curl -fsSL --retry 5 -o cache/tools/gtfs-validator.jar https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
      - name: İETT
        run: python -m iett.clean --download
      - name: Restore last good rail timetables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-latest -p timetables.json -D cache/rail --repo "$GITHUB_REPOSITORY" || echo "none yet"
      - name: Metro İstanbul
        run: python -m rail.build
      - name: Marmaray, M11, ferries
        run: python -m other.build
      - name: Merge and validate
        run: python -m merge.build --validate
      - name: Static JSON
        run: |
          python -m static.build
          tar -C out -czf out/static.tar.gz static
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Latest data" --notes "Nightly GTFS and static JSON built by the ETL." --latest=false
          gh release upload data-latest out/istanbul-gtfs.zip out/static.tar.gz cache/rail/timetables.json --clobber
          gh release edit data-latest --notes "Built $(date -u +%FT%TZ) from ${GITHUB_SHA::7}."
      - name: Rebuild the site with fresh data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main || echo "deploy-pages.yml not present yet"
      - name: Server pulls the new GTFS and reloads MOTIS
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes ubuntu@"$DEPLOY_HOST" update-data
