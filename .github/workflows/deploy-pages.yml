name: Deploy app to GitHub Pages

# Builds the PWA and bundles the newest nightly static data (release
# "data-latest") under /data. Runs on app changes, after the nightly ETL,
# or by hand.

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        env:
          # Set these as repository variables (Settings > Secrets and variables > Actions > Variables).
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          VITE_DONATE_URL: ${{ vars.DONATE_URL }}
          VITE_BASE: ${{ vars.PAGES_BASE || '/GitGel/' }}
        run: npm run build
      - name: Add nightly data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/data
          if gh release download data-latest -p static.tar.gz -D /tmp --repo "$GITHUB_REPOSITORY"; then
            tar -xzf /tmp/static.tar.gz -C /tmp && cp -r /tmp/static/. dist/data/
          else
            echo "::warning::No nightly data yet; the app will show a calm 'data unavailable' message."
          fi
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
