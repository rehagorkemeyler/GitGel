patterns:
  # Main line every 15 min. Friday and Saturday nights: four extra trains every 30 min.
  - from: Halkalı
    to: Gebze
    periods:
      - {start: "05:58", end: "23:28", headway: 15}
      - {start: "23:58", end: "01:28", headway: 30, days: [friday, saturday]}
    reverse_periods:
      - {start: "06:05", end: "23:20", headway: 15}
      - {start: "23:50", end: "01:20", headway: 30, days: [friday, saturday]}
  # Short trains between Ataköy and Pendik, half-way between main trains, giving
  # a train about every 8 min on the core. Exact first/last short trains are not
  # published; these follow the stated pattern.
  - from: Ataköy
    to: Pendik
    periods: [{start: "06:08", end: "22:38", headway: 15}]
    reverse_periods: [{start: "06:08", end: "20:38", headway: 15}]
  # From 20:50 on, trains starting at Pendik end at Zeytinburnu.
  - from: Zeytinburnu
    to: Pendik
    reverse_periods: [{start: "20:53", end: "22:38", headway: 15}]
