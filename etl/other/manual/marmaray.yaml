# TCDD Taşımacılık (published on its "günlük tren saatleri" page); the per-station
# times of the last weekday train and the service pattern are taken from
# marmaray.istanbul's June 2026 table, which copies TCDD's first/last trains.
# Intermediate trains are generated from the stated headways, so everything is
# labelled "tarifeye göre". Update when TCDD changes the timetable (ETL warns
# after 180 days).
