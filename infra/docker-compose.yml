# GitGel server stack. Started by infra/deploy.sh on every push to main.
# Only SSH is open to the internet; public traffic reaches these services
# through Cloudflare Tunnel (cloudflared joins when infra/.env has TUNNEL_TOKEN).
name: gitgel

services:
  motis:
    image: ghcr.io/motis-project/motis:2.11.3
    command: ["/motis", "server", "/data"]
    volumes:
      - /opt/gitgel-data/motis/current:/data:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Place and address search (OpenStreetMap, Turkey), used by the live service's /live/search.
  # Pinned: the weekly Turkey dump must match this Photon version (1.0).
  photon:
    image: ghcr.io/rtuszik/photon-docker@sha256:21549c60f9e6488fff3217e40429a652c4b445f374800333fe32859e47cec293
    entrypoint: ["java", "-Xmx2g", "-jar", "/photon/photon.jar", "serve", "-data-dir", "/data", "-listen-ip", "0.0.0.0"]
    volumes:
      - /opt/gitgel-data/photon/current:/data
    restart: unless-stopped

  live:
    build: ../live
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    environment:
      # Google Places (New) key for the native app's search; empty = Places off (Photon only).
      - PLACES_API_KEY=${PLACES_API_KEY:-}
      - ADMIN_LOGINS=${ADMIN_LOGINS:-}
      # Live API shield (live/src/shield.ts); empty = the defaults there.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - BLOCK_CLOUDS=${BLOCK_CLOUDS:-}
      - CLIENT_PER_MINUTE=${CLIENT_PER_MINUTE:-300}
      # Relay for İBB's API, which answers Turkish addresses only (infra/ibb-relay.mjs), e.g. http://<tailnet IP>:8888.
      - IBB_RELAY=${IBB_RELAY:-}
    volumes:
      - live-data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    restart: unless-stopped
    profiles: ["tunnel"]
    network_mode: host

volumes:
  live-data:
