# MOTIS import config for Istanbul, Ankara and Bursa. Used by infra/motis/update-data.sh,
# which drops the Ankara or Bursa block when that night's GTFS for it is missing.
# Map tiles are served by OpenFreeMap, so the MOTIS tile server is off.
osm: cities.osm.pbf
timetable:
  first_day: TODAY
  num_days: 60
  tb: false
  railviz: true
  with_shapes: true
  adjust_footpaths: true
  merge_dupes_intra_src: false
  merge_dupes_inter_src: false
  link_stop_distance: 100
  update_interval: 60
  http_timeout: 30
  canned_rt: false
  incremental_rt_update: false
  extend_missing_footpaths: false
  max_footpath_length: 15
  default_transfer_time: 2
  max_matching_distance: 25.000000
  preprocess_max_matching_distance: 250.000000
  datasets:
    istanbul:
      path: istanbul-gtfs.zip
      extend_calendar: false
      default_bikes_allowed: false
      default_cars_allowed: false
      default_reservation_not_required: true
    # ankara-begin
    ankara:
      path: ankara-gtfs.zip
      extend_calendar: false
      default_bikes_allowed: false
      default_cars_allowed: false
      default_reservation_not_required: true
    # ankara-end
    # bursa-begin
    bursa:
      path: bursa-gtfs.zip
      extend_calendar: false
      default_bikes_allowed: false
      default_cars_allowed: false
      default_reservation_not_required: true
    # bursa-end
elevators: false
street_routing: true
osr_footpath: false
geocoding: true
reverse_geocoding: true
